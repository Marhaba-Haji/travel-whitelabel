<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>marhabaDMC</title>
    <!--
      No static description/OG/Twitter tags here on purpose (the <title>
      above is safe to keep — Helmet overwrites document.title directly).
      Every route sets its own meta tags via SEOHead (react-helmet-async) —
      see src/components/seo/SEOHead.tsx. Helmet only ADDS <meta> elements,
      it never removes ones already in the raw HTML, so a static <meta>
      here would sit next to Helmet's and ship as a duplicate on every page
      (that was a real bug this fixes). scripts/prerender.mjs bakes each
      route's Helmet output into its own dist/<route>/index.html at build
      time, so this generic shell is only ever served for an unmatched path.
    -->
    <meta name="author" content="marhabaDMC" />

    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://kofijegdzeshitunwddn.supabase.co" />
    <link rel="preload" as="image" href="/assets/hero_woman_tickets.webp" fetchpriority="high" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800;900&family=Sora:wght@400;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800;900&family=Sora:wght@400;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <meta name="facebook-domain-verification" content="c6ucl7sgdghnb3ur86rr954v3a5w8o" />
    <meta name="google-site-verification" content="0yCWhSWgSTmwleVdLVVdSCI3z3ZhxaqwhwK1KvcMAqw" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["Organization", "LocalBusiness"],
        "name": "marhabaDMC",
        "description": "Start your travel business with a white-label portal, flight/hotel/visa APIs, AI sales assistant, training, and ongoing support.",
        "url": "https://marhabadmc.com",
        "logo": "https://marhabadmc.com/assets/marhaba-dmc-logo.png",
        "image": "https://marhabadmc.com/assets/marhaba-social-share.webp",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Paramount Avenue, 63/1, 3rd floor, mosque road cross, frazer town",
          "addressLocality": "Bangalore",
          "postalCode": "560005",
          "addressCountry": "IN"
        },
        "telephone": "+91-9008447887",
        "email": "hello@marhabadmc.com"
      }
    </script>
</head>

  <body>
    <!-- Inline critical CSS for instant FCP before main stylesheet loads.
         Must match the default (light) theme to avoid a dark flash. -->
    <style>
      :root{color-scheme:light}
      body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#fcfbf9;color:#1e293b}
      #root{min-height:100vh}
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
