<svg width="1920" height="300" viewBox="0 0 1920 300" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMinYMax slice">
  <!-- Lightweight landmark skyline silhouette (subtle, low-contrast for background use) -->
  <defs>
    <linearGradient id="skyGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#F3F4F6" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#E9ECEF" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <rect width="1920" height="300" fill="transparent" />

  <g fill="url(#skyGrad)" fill-opacity="0.85" stroke="none">
    <!-- baseline strip to allow seamless repeat -->
    <rect x="0" y="248" width="1920" height="6" fill="#E6E9EB" />

    <!-- Stylized landmarks (simplified silhouettes) -->
    <!-- Left cluster: Great Wall / Torii -->
    <g transform="translate(40,120)">
      <rect x="0" y="64" width="30" height="56" />
      <rect x="36" y="48" width="10" height="72" />
      <path d="M-10 64 L56 64 L56 56 L-10 56 Z" />
      <path d="M80 84 L120 36 L160 84 L148 84 L148 120 L92 120 L92 84 Z" />
    </g>

    <!-- Eiffel Tower -->
    <g transform="translate(340,60)">
      <path d="M40 180 L60 120 L80 180 Z" />
      <rect x="48" y="96" width="8" height="24" />
      <rect x="44" y="120" width="16" height="60" />
    </g>

    <!-- Big Ben / Clock Tower -->
    <g transform="translate(560,56)">
      <rect x="0" y="44" width="36" height="136" />
      <rect x="8" y="24" width="20" height="20" />
      <path d="M0 44 L36 44 L18 20 Z" />
    </g>

    <!-- Taj Mahal inspired dome -->
    <g transform="translate(760,84)">
      <rect x="0" y="56" width="56" height="96" />
      <path d="M0 56 C28 12 28 12 56 56 Z" />
      <path d="M28 12 L32 0 L24 0 Z" />
    </g>

    <!-- Leaning tower / cathedral cluster -->
    <g transform="translate(980,78)">
      <rect x="0" y="56" width="20" height="96" transform="skewY(-8)" />
      <rect x="36" y="36" width="60" height="116" />
      <path d="M36 36 L96 36 L66 0 Z" />
    </g>

    <!-- Arc / Gateway on the right -->
    <g transform="translate(1360,90)">
      <rect x="0" y="56" width="32" height="96" />
      <rect x="80" y="56" width="28" height="96" />
      <path d="M32 120 A24 24 0 0 1 80 120 L80 152 L32 152 Z" />
    </g>

    <!-- Small filler towers to make repeat feel natural -->
    <g transform="translate(1600,84)">
      <rect x="0" y="76" width="18" height="76" />
      <rect x="28" y="56" width="26" height="96" />
      <rect x="62" y="96" width="14" height="56" />
    </g>
  </g>

  <!-- very subtle dotted accents -->
  <g fill="#D6D9DB" fill-opacity="0.6">
    <circle cx="280" cy="120" r="2" />
    <circle cx="1260" cy="100" r="1.5" />
    <circle cx="1580" cy="132" r="1.5" />
  </g>
</svg>